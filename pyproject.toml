[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextslim"
version = "0.1.0"
description = "MCP server that lets an AI compress and save its own working memory as structured Context Capsules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Devi Sai Charan Vemulapalli" },
    { name = "Yagnadeep Reddy" },
]
keywords = ["mcp", "context", "compression", "llm", "session-state"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=2.0.0",
    "aiosqlite>=0.19.0",
    "tiktoken>=0.5.0",
    "google-genai>=1.0.0",
    "anthropic>=0.39.0",
    "sumy>=0.11.0",
    "nltk>=3.8",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "platformdirs>=4.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "markitdown[docx,pdf,xlsx]>=0.0.1a2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
]

[project.scripts]
contextslim = "contextslim.__main__:main"

[project.urls]
Homepage = "https://github.com/yagnadeepreddy081-reddy/contextslim"
Repository = "https://github.com/yagnadeepreddy081-reddy/contextslim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextslim = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
